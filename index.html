<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Task Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Student Task Manager</h1>
    <p>Keep track of your assignments and study tasks.</p>
  </header>

  <main>
    <section id="task-form-section">
      <h2>Add a New Task</h2>
      <form id="task-form" class="task-form">
        <label for="task-title">Task Title</label>
        <input type="text" id="task-title" placeholder="e.g. Finish Git assignment" required>

        <label for="task-description">Description</label>
        <textarea id="task-description" rows="3" placeholder="Add some details (optional)"></textarea>

        <button type="submit" id="add-btn">Add Task</button>
      </form>
    </section>

    <section id="task-list-section">
      <h2>My Tasks</h2>
      <input type="search" id="search-input" placeholder="Search tasks by title or description...">
      <ul id="task-list">
        <li class="empty">No tasks yet.</li>
      </ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
